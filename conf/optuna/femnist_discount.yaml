name: femnist-discount
direction: maximize
workers: 8

plot:
  heatmaps:
    - x: sampler.params.discount
      y: topology.sampling
      group_by:
        - sampler.reward
      aggregate_by: avg
      render: [heatmap]
      exclude_metrics: []

search_space:
  sampler.name:
    name: sampler
    type: categorical
    choices: [discounted_cucb]
  sampler.reward:
    name: reward
    type: categorical
    choices: [parameter_distance, update_cosine_similarity]
  sampler.params.exploration:
    name: exploration
    type: categorical
    choices: [1.0]
  sampler.params.discount:
    name: discount
    type: categorical
    choices: [0.9, 0.95, 0.98, 0.99, 0.995]
  topology.sampling:
    name: sampling
    type: categorical
    choices: [0.1, 0.2, 0.4]
