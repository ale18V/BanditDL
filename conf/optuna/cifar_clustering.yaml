name: cifar-clustering-low-lr
direction: maximize
workers: 42

plot:
  directions: [final]
  heatmaps: []
  lines:
    - x: sweep.sampler
      group_by:
        - sampler.reward
      aggregate_by: avg
      metrics: [validation_accuracy, global_accuracy]
      exclude_metrics: []

search_space:
  sweep.sampler:
    name: sampler
    type: tuple
    choices:
      - label: uniform
        params:
          sampler.name: uniform
      - label: epsilon_greedy
        params:
          sampler.name: epsilon_greedy
          sampler.params.epsilon: 0.1
          sampler.params.initial_value: 0.0
      - label: exp3
        params:
          sampler.name: exp3
          sampler.params.gamma: auto
          sampler.params.lower: 0.0
          sampler.params.amplitude: 1.0
      - label: cucb
        params:
          sampler.name: cucb
          sampler.params.exploration: 2.0
      - label: cts
        params:
          sampler.name: cts
      - label: discounted_cucb
        params:
          sampler.name: discounted_cucb
          sampler.params.exploration: 2.0
          sampler.params.discount: 0.9
      - label: discounted_cts
        params:
          sampler.name: discounted_cts
          sampler.params.discount: 0.9
  sampler.reward:
    name: reward
    type: categorical
    choices: [parameter_distance, update_cosine_similarity]
