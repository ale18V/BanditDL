name: mnist-sf-controlled
direction: maximize
workers: 40
seeds: [0, 1, 2]

plot:
  directions: [final]
  single_runs:
    enabled: true
  heatmaps:
    - x: sweep.adversary
      y: sweep.sampler
      split_by:
        - heterogeneity.alpha
      aggregate_by: avg
      render: [heatmap]
      metrics: [validation_accuracy, global_accuracy]
      exclude_metrics: []
  lines:
    - x: sweep.adversary
      group_by:
        - sweep.sampler
      split_by:
        - heterogeneity.alpha
      aggregate_by: avg
      metrics: [validation_accuracy, global_accuracy]
      exclude_metrics: []

search_space:
  sweep.adversary:
    name: adversary
    type: tuple
    choices:
      - label: honest
        params:
          topology.nodes: 30
          topology.sampling: 0.2
          adversary.byzcount: 0
          adversary.byzantine_budget: 0
          adversary.attack: null
      - label: sf_f3
        params:
          topology.nodes: 33
          topology.sampling: 0.1875
          adversary.byzcount: 3
          adversary.byzantine_budget: 3
          adversary.attack: SF
      - label: sf_f6
        params:
          topology.nodes: 36
          topology.sampling: 0.17142857142857143
          adversary.byzcount: 6
          adversary.byzantine_budget: 6
          adversary.attack: SF
  heterogeneity.alpha:
    name: alpha
    type: categorical
    choices: [0.5, 1.0, 10.0]
  sweep.sampler:
    name: sampler
    type: tuple
    choices:
      - label: uniform
        params:
          sampler.name: uniform
      - label: epsilon_greedy
        params:
          sampler.name: epsilon_greedy
          sampler.params.epsilon: 0.1
          sampler.params.initial_value: 0.0
      - label: exp3
        params:
          sampler.name: exp3
          sampler.params.gamma: auto
          sampler.params.lower: 0.0
          sampler.params.amplitude: 1.0
      - label: cucb
        params:
          sampler.name: cucb
          sampler.params.exploration: 1.0
      - label: cts
        params:
          sampler.name: cts
