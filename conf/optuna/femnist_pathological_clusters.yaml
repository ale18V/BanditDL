name: femnist-pathological-clusters
direction: maximize
workers: 8

plot:
  heatmaps:
    - x: sweep.partition_profile
      y: sampler.name
      aggregate_by: avg
      render: [heatmap]
      exclude_metrics: []
    - x: sweep.partition_profile
      y: sampler.reward
      group_by:
        - sampler.name
      aggregate_by: avg
      render: [heatmap]
      exclude_metrics: []

search_space:
  sweep.partition_profile:
    name: partition
    type: tuple
    choices:
      - label: c3_k15_s0.3
        params:
          heterogeneity.method: pathological
          heterogeneity.alpha: null
          heterogeneity.clusters: 3
          heterogeneity.classes_per_group: 15
          heterogeneity.group_overlap: 0
          topology.sampling: 0.3
      - label: c5_k9_s0.2
        params:
          heterogeneity.method: pathological
          heterogeneity.alpha: null
          heterogeneity.clusters: 5
          heterogeneity.classes_per_group: 9
          heterogeneity.group_overlap: 0
          topology.sampling: 0.2
      - label: c10_k4_s0.1
        params:
          heterogeneity.method: pathological
          heterogeneity.alpha: null
          heterogeneity.clusters: 10
          heterogeneity.classes_per_group: 4
          heterogeneity.group_overlap: 0
          topology.sampling: 0.1
  sampler.name:
    name: sampler
    type: categorical
    choices: [uniform, epsilon_greedy, exp3, cucb, cts, discounted_cucb, discounted_cts]
  sampler.reward:
    name: reward
    type: categorical
    choices: [parameter_distance, update_cosine_similarity]
    when:
      sampler.name: [epsilon_greedy, exp3, cucb, cts, discounted_cucb, discounted_cts]
  sampler.params.epsilon:
    name: epsilon
    type: categorical
    choices: [0.1]
    when:
      sampler.name: [epsilon_greedy]
  sampler.params.gamma:
    name: gamma
    type: categorical
    choices: [auto]
    when:
      sampler.name: [exp3]
  sampler.params.exploration:
    name: exploration
    type: categorical
    choices: [1.0]
    when:
      sampler.name: [cucb, discounted_cucb]
  sampler.params.discount:
    name: discount
    type: categorical
    choices: [0.99]
    when:
      sampler.name: [discounted_cucb, discounted_cts]
