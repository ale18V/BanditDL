dataset: femnist
model: cnn_femnist
numb_labels: 62
provider:
  _target_: banditdl.data.providers.FemnistProvider
partitioner:
  _target_: banditdl.data.partitioning.SyntheticPartitionStrategy
  method: ${heterogeneity.method}
  num_classes: ${dataset.numb_labels}
