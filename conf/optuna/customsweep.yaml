direction: maximize
devices: null
search_space:
  heterogeneity.alpha:
    name: alpha
    type: categorical
    choices: [0.01, 1.0, 10.0, 100.0]
  topology.sampling:
    type: categorical
    choices: [0.01, 0.1, 0.5, 0.9]
  sampler:
    name: sampler
    type: categorical
    choices: [uniform, epsilon_greedy, exp3]
  sampler.params.epsilon:
    name: epsilon
    type: categorical
    choices: [0.01, 0.1, 0.5, 0.9]
    when:
      sampler: epsilon_greedy
  sampler.params.gamma:
    name: gamma
    type: categorical
    choices: [auto, 0.01, 0.05, 0.1]
    when:
      sampler: exp3
