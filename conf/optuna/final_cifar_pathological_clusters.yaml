name: final-cifar-pathological-clusters
direction: maximize
workers: 44
seeds: [0, 1, 2]

plot:
  directions: [final]
  heatmaps:
    - x: sweep.partition_profile
      y: sampler.name
      aggregate_by: avg
      render: [heatmap]
      metrics: [validation_accuracy, global_accuracy]
      exclude_metrics: []
    - x: sweep.partition_profile
      y: sampler.reward
      split_by:
        - sampler.name
      aggregate_by: avg
      render: [heatmap]
      metrics: [validation_accuracy, global_accuracy]
      exclude_metrics: []
  lines: []

search_space:
  sweep.partition_profile:
    name: partition
    type: tuple
    choices:
      - label: c3_k4_s0.3
        params:
          heterogeneity.method: pathological
          heterogeneity.clusters: 3
          heterogeneity.classes_per_group: 4
          topology.sampling: 0.3
      - label: c5_k2_s0.2
        params:
          heterogeneity.method: pathological
          heterogeneity.clusters: 5
          heterogeneity.classes_per_group: 2
          topology.sampling: 0.2
      - label: c10_k1_s0.1
        params:
          heterogeneity.method: pathological
          heterogeneity.clusters: 10
          heterogeneity.classes_per_group: 1
          topology.sampling: 0.1
  sweep.sampler:
    name: sampler
    type: tuple
    choices:
      - label: uniform
        params:
          sampler.name: uniform
      - label: epsilon_greedy
        params:
          sampler.name: epsilon_greedy
          sampler.params.epsilon: 0.1
          sampler.params.initial_value: 0.0
      - label: exp3
        params:
          sampler.name: exp3
          sampler.params.gamma: auto
          sampler.params.lower: 0.0
          sampler.params.amplitude: 1.0
      - label: cucb
        params:
          sampler.name: cucb
          sampler.params.exploration: 1.0
      - label: cts
        params:
          sampler.name: cts
      - label: discounted_cucb
        params:
          sampler.name: discounted_cucb
          sampler.params.exploration: 1.0
      - label: discounted_cts
        params:
          sampler.name: discounted_cts
  heterogeneity.group_overlap:
    name: group_overlap
    type: categorical
    choices: [0, 1]
    when:
      sweep.partition_profile: [c3_k4_s0.3, c5_k2_s0.2]
  sampler.reward:
    name: reward
    type: categorical
    choices: [parameter_distance, update_cosine_similarity]
  sampler.params.discount:
    name: discount
    type: categorical
    choices: [0.9, 0.95, 0.99]
    when:
      sampler.name: [discounted_cucb, discounted_cts]
