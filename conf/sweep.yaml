defaults:
  - config
  - optuna: alpha_grid
  - _self_

hydra:
  run:
    dir: ${oc.env:SCRATCH}/banditdl/optuna_runs/${optuna.name}/${now:%Y-%m-%d_%H-%M-%S}_${oc.env:SLURM_JOB_ID,local}

optuna:
  seeds:
    - ${seed}

plot:
  enabled: true
  directions:
    - final
    - mean
    - worst

  # By default, sweep plots try every known scalar metric saved by the runs.
  # Individual plot specs can remove metrics with exclude_metrics.
  heatmaps:
    - x: heterogeneity.alpha
      y: topology.sampling
      split_by:
        - sampler.name
        - [sampler.name, sampler.params.epsilon]
      aggregate_by: avg
      render: [heatmap]
      exclude_metrics: []

  single_runs:
    enabled: false
