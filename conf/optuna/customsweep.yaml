name: femnist-pre-sweep
direction: maximize
workers: 8

plot:
  heatmaps:
    - x: heterogeneity.alpha
      y: topology.sampling
      split_by:
        - sampler.name
        - sampler.reward
      aggregate_by: avg
      render: [heatmap]
      exclude_metrics: []

# Small exhaustive example. Expand the categorical choices for production.
search_space:
  topology.sampling:
    name: sampling
    type: categorical
    choices: [0.1, 0.2, 0.4]
  sampler.name:
    name: sampler
    type: categorical
    choices: [uniform, cucb, discounted_cucb]
  sampler.reward:
    name: reward
    type: categorical
    choices: [parameter_distance, update_cosine_similarity]
    when:
      sampler.name: [cucb, cucb, discounted_cucb]
  sampler.params.exploration:
    name: exploration
    type: categorical
    choices: [1.0]
    when:
      sampler.name: [cucb, discounted_cucb]
  sampler.params.discount:
    name: discount
    type: categorical
    choices: [0.99, 0.95, 0.9]
    when:
      sampler.name: [discounted_cucb]
